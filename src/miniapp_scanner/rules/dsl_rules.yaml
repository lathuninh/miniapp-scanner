rules:
  - id: DSL-001
    info:
      name: "eval with tainted arg"
      severity: high
      description: "Tainted data flows into eval"
      suggestion: "Use JSON.parse; never eval user input"
    dsl:
      node: CallExpression
      conditions:
        - eq: [callee.name, "eval"]
        - arg_tainted: [0]
      code: "eval(tainted)"

  - id: DSL-002
    info:
      name: "wx.request with tainted arg"
      severity: medium
      description: "wx.request params derived from tainted data"
      suggestion: "Whitelist URL domain and validate param types"
    dsl:
      node: CallExpression
      conditions:
        - eq: [callee.property.name, "request"]
        - or:
            - arg_tainted: [0]
            - arg_tainted: [1]
      code: "wx.request(tainted, ...)"
# ==================== 实用规则集 v1 ====================

  - id: DSL-003
    info:
      name: "Sensitive data stored in local storage"
      severity: high
      description: "Token/password/secret written into wx.setStorage or localStorage"
      suggestion: "Never store credentials in local storage; use backend session or wx.loginCode exchange"
    dsl:
      node: CallExpression
      conditions:
        - or:
            - and:
                - eq: [callee.object.name, "wx"]
                - eq: [callee.property.name, "setStorageSync"]
            - and:
                - eq: [callee.object.name, "wx"]
                - eq: [callee.property.name, "setStorage"]
            - and:
                - eq: [callee.object.name, "localStorage"]
                - eq: [callee.property.name, "setItem"]
        - or:
            - match: [ arguments.0.value, "(?i)^(token|password|passwd|pwd|secret|credential|auth|access_token|refresh_token)$" ]
            - match: [ arguments.0.name, "(?i)(^|[_-])(token|password|passwd|pwd|secret|credential|auth)([_-]|$)" ]
      code: "wx.setStorageSync('token', ...)"



  - id: DSL-006
    info:
      name: "Prototype pollution via Object.assign"
      severity: high
      description: "User-controlled object merged via Object.assign / spread, may pollute prototype"
      suggestion: "Validate keys; use Object.create(null); reject __proto__ / constructor / prototype keys"
    dsl:
      node: CallExpression
      conditions:
        - or:
            - and:
                - eq: [callee.object.name, "Object"]
                - eq: [callee.property.name, "assign"]
            - and:
                - eq: [callee.object.name, "_"]
                - eq: [callee.property.name, "merge"]
            - and:
                - eq: [callee.object.name, "_"]
                - eq: [callee.property.name, "defaultsDeep"]
        - or:
            - arg_tainted: [0]
            - arg_tainted: [1]
      code: "Object.assign(target, tainted)"
  # ==================== XSS 相关 ====================



  - id: DSL-011
    info:
      name: "wx.showToast with tainted content"
      severity: low
      description: "User data flows into toast title"
      suggestion: "Escape before display"
    dsl:
      node: CallExpression
      conditions:
        - eq: [ callee.object.name, "wx" ]
        - eq: [ callee.property.name, "showToast" ]
        - arg_tainted: [ 0 ]
      code: "wx.showToast(tainted)"

  # ==================== SSRF / 网络请求 ====================

  - id: DSL-012
    info:
      name: "wx.request URL from user input"
      severity: high
      description: "User data flows into wx.request URL, potential SSRF"
      suggestion: "Whitelist allowed domains; validate URL scheme"
    dsl:
      node: CallExpression
      conditions:
        - eq: [ callee.object.name, "wx" ]
        - eq: [ callee.property.name, "request" ]
        - arg_tainted: [ 0 ]
      code: "wx.request(tainted_url)"

  - id: DSL-013
    info:
      name: "wx.downloadFile URL from user input"
      severity: high
      description: "User data flows into wx.downloadFile URL"
      suggestion: "Whitelist allowed domains"
    dsl:
      node: CallExpression
      conditions:
        - eq: [ callee.object.name, "wx" ]
        - eq: [ callee.property.name, "downloadFile" ]
        - arg_tainted: [ 0 ]
      code: "wx.downloadFile(tainted_url)"

  - id: DSL-014
    info:
      name: "wx.uploadFile URL from user input"
      severity: high
      description: "User data flows into wx.uploadFile URL"
      suggestion: "Whitelist allowed domains"
    dsl:
      node: CallExpression
      conditions:
        - eq: [ callee.object.name, "wx" ]
        - eq: [ callee.property.name, "uploadFile" ]
        - arg_tainted: [ 0 ]
      code: "wx.uploadFile(tainted_url)"

  # ==================== 存储相关 ====================


  - id: DSL-016
    info:
      name: "Sensitive data in wx.setStorage"
      severity: high
      description: "Token/password/secret written into wx.setStorage"
      suggestion: "Never store credentials locally"
    dsl:
      node: CallExpression
      conditions:
        - eq: [ callee.object.name, "wx" ]
        - eq: [ callee.property.name, "setStorage" ]
        - or:
            - match: [ arguments.0.value, "(?i)^(token|password|passwd|pwd|secret|credential|auth|access_token|refresh_token)$" ]
            - match: [ arguments.0.name, "(?i)(^|[_-])(token|password|passwd|pwd|secret|credential|auth)([_-]|$)" ]
      code: "wx.setStorage({key:'token',...})"

  # ==================== 原型链污染 ====================

  - id: DSL-017
    info:
      name: "Prototype pollution via __proto__ assignment"
      severity: high
      description: "Direct __proto__ assignment detected"
      suggestion: "Never assign to __proto__; use Object.create(null)"
    dsl:
      node: AssignmentExpression
      conditions:
        - or:
            - eq: [ left.property.name, "__proto__" ]
            - eq: [ left.property.value, "__proto__" ]
            - eq: [ left.property.name, "prototype" ]
            - eq: [ left.property.name, "constructor" ]
      code: "obj.__proto__ = ..."

  - id: DSL-018
    info:
      name: "Prototype pollution via lodash merge"
      severity: high
      description: "Lodash merge/defaultsDeep with user input"
      suggestion: "Validate keys; reject dangerous property names"
    dsl:
      node: CallExpression
      conditions:
        - or:
            - and:
                - eq: [ callee.object.name, "_" ]
                - eq: [ callee.property.name, "merge" ]
            - and:
                - eq: [ callee.object.name, "_" ]
                - eq: [ callee.property.name, "defaultsDeep" ]
            - and:
                - eq: [ callee.object.name, "_" ]
                - eq: [ callee.property.name, "set" ]
        - or:
            - arg_tainted: [ 0 ]
            - arg_tainted: [ 1 ]
      code: "_.merge(target, tainted)"

  # ==================== 敏感操作 ====================

  - id: DSL-019
    info:
      name: "wx.openDocument with user file path"
      severity: medium
      description: "User data flows into openDocument filePath"
      suggestion: "Validate file path whitelist"
    dsl:
      node: CallExpression
      conditions:
        - eq: [ callee.object.name, "wx" ]
        - eq: [ callee.property.name, "openDocument" ]
        - arg_tainted: [ 0 ]
      code: "wx.openDocument(tainted)"

  - id: DSL-020
    info:
      name: "wx.navigateToMiniProgram without validation"
      severity: high
      description: "User data flows into navigateToMiniProgram appId/path"
      suggestion: "Whitelist target appId"
    dsl:
      node: CallExpression
      conditions:
        - eq: [ callee.object.name, "wx" ]
        - eq: [ callee.property.name, "navigateToMiniProgram" ]
        - arg_tainted: [ 0 ]
      code: "wx.navigateToMiniProgram(tainted)"

  - id: DSL-021
    info:
      name: "wx.setClipboardData with tainted data"
      severity: medium
      description: "User data written into clipboard"
      suggestion: "Validate before writing"
    dsl:
      node: CallExpression
      conditions:
        - eq: [ callee.object.name, "wx" ]
        - eq: [ callee.property.name, "setClipboardData" ]
        - arg_tainted: [ 0 ]
      code: "wx.setClipboardData(tainted)"

  - id: DSL-022
    info:
      name: "Dynamic code via new Function"
      severity: high
      description: "Function constructor called with tainted argument"
      suggestion: "Never use Function constructor on user input"
    dsl:
      node: NewExpression
      conditions:
        - eq: [ callee.name, "Function" ]
        - arg_tainted: [ 0 ]
      code: "new Function(tainted)"

  - id: DSL-023
    info:
      name: "eval with tainted argument (strict)"
      severity: high
      description: "User data flows into eval"
      suggestion: "Use JSON.parse; never eval user input"
    dsl:
      node: CallExpression
      conditions:
        - eq: [ callee.name, "eval" ]
        - arg_tainted: [ 0 ]
        - not:
            file_match: ".*\\.test\\.js$"
      code: "eval(tainted)"


  - id: DSL-025
    info:
        name: "wx.requestPayment with tainted amount"
        severity: high
        description: "User-controlled amount flows into payment API"
        suggestion: "Validate amount server-side; never trust frontend"
    dsl:
        node: CallExpression
        conditions:
            - eq: [ callee.object.name, "wx" ]
            - eq: [ callee.property.name, "requestPayment" ]
            - arg_tainted: [ 0 ]
        code: "wx.requestPayment(tainted)"

  - id: DSL-026
    info:
        name: "wx.openLocation with tainted coords"
        severity: medium
        description: "User-controlled coordinates flow into openLocation"
        suggestion: "Validate latitude/longitude ranges"
    dsl:
        node: CallExpression
        conditions:
            - eq: [ callee.object.name, "wx" ]
            - eq: [ callee.property.name, "openLocation" ]
            - arg_tainted: [ 0 ]
        code: "wx.openLocation(tainted)"

  - id: DSL-027
    info:
        name: "wx.setClipboardData with tainted data"
        severity: low
        description: "User-controlled data written into clipboard"
        suggestion: "Validate before writing to clipboard"
    dsl:
        node: CallExpression
        conditions:
            - eq: [ callee.object.name, "wx" ]
            - eq: [ callee.property.name, "setClipboardData" ]
            - arg_tainted: [ 0 ]
        code: "wx.setClipboardData(tainted)"

  - id: DSL-030
    info:
        name: "Sensitive data into wx.showToast"
        severity: low
        description: "User data displayed in toast"
        suggestion: "Avoid showing user-controlled data in toast"
    dsl:
        node: CallExpression
        conditions:
              - eq: [ callee.object.name, "wx" ]
              - eq: [ callee.property.name, "showToast" ]
              - arg_tainted: [ 0 ]
        code: "wx.showToast(tainted)"

  - id: DSL-031
    info:
        name: "wx.setNavigationBarTitle with tainted data"
        severity: low
        description: "User-controlled data written into navigation bar title"
        suggestion: "Validate or sanitize before setting title"
    dsl:
        node: CallExpression
        conditions:
              - eq: [ callee.object.name, "wx" ]
              - eq: [ callee.property.name, "setNavigationBarTitle" ]
              - arg_tainted: [ 0 ]
        code: "wx.setNavigationBarTitle(tainted)"

  - id: DSL-032
    info:
        name: "wx.previewImage with tainted URL"
        severity: medium
        description: "User-controlled image URL previewed"
        suggestion: "Whitelist image domains"
    dsl:
        node: CallExpression
        conditions:
              - eq: [ callee.object.name, "wx" ]
              - eq: [ callee.property.name, "previewImage" ]
              - arg_tainted: [ 0 ]
        code: "wx.previewImage(tainted)"

  - id: DSL-033
    info:
        name: "wx.setEnableDebug with tainted value"
        severity: high
        description: "User-controlled debug flag setting"
        suggestion: "Never let user control debug mode"
    dsl:
        node: CallExpression
        conditions:
              - eq: [ callee.object.name, "wx" ]
              - eq: [ callee.property.name, "setEnableDebug" ]
              - arg_tainted: [ 0 ]
        code: "wx.setEnableDebug(tainted)"

  - id: DSL-040
    info:
      name: "DOM Clobbering: global variable overwrite"
      severity: high
      description: "Assigning to global property that may clobber DOM APIs"
      suggestion: "Use local scope or namespace; avoid clobbering global"
    dsl:
      node: AssignmentExpression
      conditions:
        - match: [left.property.name, "^(document|window|self|globalThis|top|parent|location|navigator)$"]
      code: "window.document = ..."

  - id: DSL-041
    info:
      name: "DOM Clobbering: id/name collision"
      severity: medium
      description: "Element with id/name that may shadow global variable"
      suggestion: "Use unique ids; avoid names matching global APIs"
    dsl:
      node: CallExpression
      conditions:
        - or:
            - eq: [callee.property.name, "getElementById"]
            - eq: [callee.property.name, "querySelector"]
        - arg_tainted: [0]
      code: "document.getElementById(tainted)"