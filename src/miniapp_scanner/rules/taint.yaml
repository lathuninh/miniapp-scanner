sources:
  # 微信 API 返回值
  - name: "wx.getStorageSync"
    taint_returns: true
  - name: "wx.getStorage"
    taint_returns: true
  - name: "wx.getUserInfo"
    taint_returns: true
  - name: "wx.getUserProfile"
    taint_returns: true
  - name: "wx.getClipboardData"
    taint_returns: true
  - name: "wx.getSystemInfo"
    taint_returns: true
  - name: "wx.getSystemInfoSync"
    taint_returns: true
  - name: "wx.getLaunchOptionsSync"
    taint_returns: true
  - name: "wx.getEnterOptionsSync"
    taint_returns: true

  # 生命周期函数参数
  - name: "onLoad"
    taint_params: true
  - name: "onShareAppMessage"
    taint_params: true

  # 事件对象成员
  - member: "event.detail.value"
  - member: "e.detail.value"
  - member: "e.currentTarget.dataset.keyword"
  - member: "e.currentTarget.dataset.value"
  - member: "e.currentTarget.dataset.id"
  - member: "event.currentTarget.dataset"
  - member: "options.query"
  - member: "this.data.keyword"

  # 接口响应数据
  - member: "res.data"
  - member: "response.data"
  - member: "result.data"

  # Web 专用污点源
  - member: "location.search"
  - member: "location.hash"
  - member: "location.href"
  - member: "document.cookie"
  - member: "document.referrer"
  - member: "window.name"
  - member: "event.data"
  - member: "postMessage"

sinks:
  - name: "eval"
    dangerous_arg: [0]
    severity: high
    message: "Tainted data flows into eval"
    suggestion: "Use JSON.parse; never eval user input"
  - name: "Function"
    dangerous_arg: [0]
    severity: high
    message: "Tainted data flows into Function constructor"
    suggestion: "Remove dynamic construction"
  - name: "setTimeout"
    dangerous_arg: [0]
    severity: medium
    message: "setTimeout with string arg is code execution"
    suggestion: "Pass function object instead"
  - name: "wx.navigateTo"
    dangerous_arg: [0]
    severity: low
    message: "Tainted URL flows into navigation"
    suggestion: "Whitelist target pages"
  - name: "wx.redirectTo"
    dangerous_arg: [0]
    severity: medium
    message: "Tainted URL flows into redirect"
    suggestion: "Whitelist target pages"
  - name: "wx.request"
    dangerous_arg: [0, 1]
    severity: medium
    message: "Tainted data flows into network request"
    suggestion: "Whitelist URL domain, validate params"
  - name: "wx.setStorageSync"
    dangerous_arg: [1]
    severity: high
    message: "Tainted data stored into local storage"
    suggestion: "Never store sensitive data in local storage"
  - name: "wx.setStorage"
    dangerous_arg: [0]
    severity: high
    message: "Tainted data stored into local storage"
    suggestion: "Never store sensitive data in local storage"
  - name: "wx.setClipboardData"
    dangerous_arg: [0]
    severity: medium
    message: "Tainted data written into clipboard"
    suggestion: "Validate before writing to clipboard"
  - name: "Object.assign"
    dangerous_arg: [0, 1]
    severity: high
    message: "Tainted object merged via Object.assign, prototype pollution risk"
    suggestion: "Validate keys; reject __proto__/constructor/prototype"
  - name: "wx.requestPayment"
    dangerous_arg: [ 0 ]
    severity: high
    message: "Tainted data flows into payment"
    suggestion: "Validate amount server-side"
  - name: "wx.openLocation"
    dangerous_arg: [ 0 ]
    severity: medium
    message: "Tainted data flows into openLocation"
    suggestion: "Validate coordinate ranges"
  - name: "wx.showToast"
    dangerous_arg: [ 0 ]
    severity: low
    message: "Tainted data into showToast"
    suggestion: "Sanitize before display"
  - name: "wx.setNavigationBarTitle"
    dangerous_arg: [ 0 ]
    severity: low
    message: "Tainted data into navigation title"
    suggestion: "Sanitize before display"
  - name: "wx.previewImage"
    dangerous_arg: [ 0 ]
    severity: medium
    message: "Tainted URL into previewImage"
    suggestion: "Whitelist image domains"

  - name: "document.write"
    dangerous_arg: [0]
    severity: high
    message: "Tainted data into document.write"
    suggestion: "Avoid document.write; use DOM manipulation"
  - name: "eval"
    dangerous_arg: [0]
    severity: high
    message: "Tainted data into eval"
    suggestion: "Never eval user input"
  - name: "setTimeout"
    dangerous_arg: [0]
    severity: medium
    message: "Tainted string into setTimeout"
    suggestion: "Use function callback"

member_sinks:
  - member: "innerHTML"
    severity: high
    message: "Tainted data flows into innerHTML (XSS)"
    suggestion: "Use textContent or sanitize with DOMPurify"
  - member: "nodes"
    severity: high
    message: "Tainted data flows into rich-text nodes (XSS)"
    suggestion: "Sanitize HTML before rendering rich-text"

  - member: "innerHTML"
    severity: high
    message: "Tainted data into innerHTML (XSS)"
    suggestion: "Use textContent or sanitize"
  - member: "outerHTML"
    severity: high
    message: "Tainted data into outerHTML (XSS)"
    suggestion: "Use replaceWith or sanitize"
  - member: "src"
    severity: medium
    message: "Tainted URL into src attribute"
    suggestion: "Whitelist allowed sources"
  - member: "href"
    severity: medium
    message: "Tainted URL into href attribute"
    suggestion: "Whitelist allowed domains"

sanitizers:
  - name: "encodeURIComponent"
  - name: "encodeURI"
  - name: "escape"
  - name: "parseInt"
  - name: "parseFloat"
  - name: "Number"
  - name: "DOMPurify.sanitize"
  - name: "sanitizeHtml"
