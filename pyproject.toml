[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "miniapp-scanner"
version = "0.5.0"
description = "WeChat mini-program static security scanner (AST + taint + DSL + LLM)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "PyYAML>=6.0",
    "esprima>=4.0.1",
    "tqdm>=4.65.0",
    "colorama>=0.4.6",       # ← 新增
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
miniapp-scanner = "miniapp_scanner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
miniapp_scanner = ["rules/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"